# --- UI and API Execution URLs ---
# This is the single switch for "which website does this framework test".
# BaseTest.java, EndToEndAiExecution.java, and the whole AI pipeline (DOM
# discovery -> action mapping -> generated Selenium code) all read uiBaseUrl
# from here. Point it at a different site and the framework tests that site -
# no code changes needed for the URL itself. See UNIVERSAL_SITE_SUPPORT.md.
baseUrl=https://parabank.parasoft.com/parabank
uiBaseUrl=https://parabank.parasoft.com/parabank
apiBaseUrl=https://parabank.parasoft.com/parabank/services/bank

# --- AI Execution Registry (which existing test/page classes get auto-discovered) ---
# TestRegistry and PageObjectRegistry scan these packages at runtime and derive keyword
# mappings from class names automatically - see PROJECT_CLEANUP_AND_UNIVERSAL_SITE_SUPPORT.md.
# These are NOT read from this file (they're plain Java System properties, read before any
# config file is loaded) - override them on the command line instead if needed:
#   mvn test -Dtests.basePackage=com.acme.tests -Dpages.basePackage=com.acme.pages
# Defaults if not set: com.enterprise.banking.tests / com.enterprise.banking.pages

# --- Browser Configuration ---
browser=chrome
headless=true

# --- Execution Mode Configuration ---
# Valid values for execution.mode are 'local' or 'grid'
execution.mode=local
# Use 'http://selenium-hub:4444' when running inside Docker Compose
# Use 'http://localhost:4444' if running locally from IDE against Docker Grid
gridUrl=http://selenium-hub:4444

# Timeouts
implicitWait=10
explicitWait=15

# Database Configuration (H2 Embedded Database)
dbUrl=jdbc:h2:file:./target/automationdb;AUTO_SERVER=TRUE
dbUsername=sa
dbPassword=sa