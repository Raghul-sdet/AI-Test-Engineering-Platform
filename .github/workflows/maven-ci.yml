name: Enterprise QA CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install and Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &

          # Wait for Ollama to be reachable (up to 60s) before pulling the model.
          # A fixed sleep is not reliable on resource-constrained runners.
          echo "Waiting for Ollama to become ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is ready after ${i}x2s attempts."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: Ollama did not start within 60 seconds. Failing step."
              exit 1
            fi
            sleep 2
          done

          ollama pull qwen2.5:3b-instruct

      - name: Run Full Test Suite
        run: mvn clean verify "-DsuiteXmlFile=full-suite.xml"

      - name: Analyze with SonarCloud
        if: ${{ secrets.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=raghul-sdet \
            -Dsonar.host.url=https://sonarcloud.io
        continue-on-error: true

      - name: SonarCloud skipped notice
        if: ${{ secrets.SONAR_TOKEN == '' }}
        run: echo "Sonar skipped — SONAR_TOKEN secret not configured in this repository."

      - name: SonarCloud Quality Gate Check
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        with:
          scanMetadataReportFile: target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 7

      - name: Upload Excel Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports
          path: target/reports/*.xlsx
          retention-days: 7